name: One-time README notice update
on:
  push:
    branches: [main]
    paths: ['.github/workflows/simon-readme-notice-once.yml']
permissions:
  contents: write
jobs:
  update-readmes:
    if: github.repository == 'simonlin1212/awesome-mcp-servers'
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Insert notices without executing repository code
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          python3 -I - <<'PY'
          import base64
          import hashlib
          import json
          import os
          import urllib.request

          REPO = 'simonlin1212/awesome-mcp-servers'
          BASE = 'https://api.github.com/repos/' + REPO
          assert os.environ['GITHUB_REPOSITORY'] == REPO
          parent = os.environ['GITHUB_SHA']

          class NoRedirect(urllib.request.HTTPRedirectHandler):
              def redirect_request(self, *args, **kwargs):
                  raise RuntimeError('Redirects are not allowed')

          opener = urllib.request.build_opener(NoRedirect())
          def api(path, data=None, method=None):
              assert path.startswith('/') and not path.startswith('//')
              request = urllib.request.Request(
                  BASE + path,
                  data=None if data is None else json.dumps(data).encode('utf-8'),
                  headers={
                      'Authorization': 'Bearer ' + os.environ['GH_TOKEN'],
                      'Accept': 'application/vnd.github+json',
                      'Content-Type': 'application/json',
                      'User-Agent': 'simon-readme-notice-once',
                  },
                  method=method or ('GET' if data is None else 'POST'),
              )
              with opener.open(request, timeout=30) as response:
                  return json.load(response)

          def blob_sha(raw):
              return hashlib.sha1(b'blob ' + str(len(raw)).encode('ascii') + b'\0' + raw).hexdigest()

          notices = {
              'README.md': (
                  'ec60ed0b8e564d3ccb760b8cb260a389ed21dc65',
                  '**Fork Maintainer · Open to Work · Shenzhen / Hong Kong / Remote**\n\n'
                  "I'm Simon, focused on building AI agents and practical tools, and I'm looking for opportunities in Shenzhen, Hong Kong, or remotely.  \n"
                  'Get in touch: [simonlin0423@gmail.com](mailto:simonlin0423@gmail.com).'
              ),
              'README-zh.md': (
                  '66200e5c9097b498cc6d06cee7576db16d8974cc',
                  '**本 Fork 维护者求职｜深圳 · 香港 · 远程**\n\n'
                  '我是 Simon，专注于 AI Agent 与实用工具开发，正在寻找深圳、香港或远程工作机会。  \n'
                  '欢迎联系：[simonlin0423@gmail.com](mailto:simonlin0423@gmail.com)。'
              ),
          }
          assert api('/git/ref/heads/main')['object']['sha'] == parent, 'Concurrent update; stopping'
          base_tree = api('/git/commits/' + parent)['tree']['sha']
          changes = []
          for filename, (expected_sha, notice) in notices.items():
              source = api('/git/blobs/' + expected_sha)
              assert source['encoding'] == 'base64'
              raw = base64.b64decode(source['content'])
              assert blob_sha(raw) == expected_sha, 'Incomplete source'
              current = api('/contents/' + filename + '?ref=' + parent)
              assert current['sha'] == expected_sha, 'README changed; stopping'
              text = raw.decode('utf-8')
              assert text.encode('utf-8') == raw
              assert 'Open to Work · Shenzhen / Hong Kong / Remote' not in text
              assert '维护者求职｜深圳 · 香港 · 远程' not in text
              marker = '\n---\n'
              position = text.index(marker) + len(marker)
              insertion = '\n' + notice + '\n\n---\n'
              updated = text[:position] + insertion + text[position:]
              assert updated.replace(insertion, '', 1) == text
              uploaded = api('/git/blobs', {'content': updated, 'encoding': 'utf-8'})
              assert uploaded['sha'] == blob_sha(updated.encode('utf-8'))
              changes.append({'path': filename, 'mode': '100644', 'type': 'blob', 'sha': uploaded['sha']})
          assert {item['path'] for item in changes} == {'README.md', 'README-zh.md'}
          tree = api('/git/trees', {'base_tree': base_tree, 'tree': changes})
          commit = api('/git/commits', {
              'message': 'docs: add concise fork-maintainer open-to-work notices',
              'tree': tree['sha'], 'parents': [parent],
          })
          assert api('/git/ref/heads/main')['object']['sha'] == parent, 'Concurrent update; stopping'
          api('/git/refs/heads/main', {'sha': commit['sha'], 'force': False}, method='PATCH')
          print('README notice commit:', commit['sha'])
          PY
